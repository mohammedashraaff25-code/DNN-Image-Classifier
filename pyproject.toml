# Tooling configuration only (the project is run with `python -m src.<module>`).

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # modern Python syntax
    "B",        # likely bugs
    "SIM",      # simplifications
    "C4",       # comprehensions
    "N",        # naming
    "D1",       # missing docstrings
]
# X_train / X_val / X_test is the standard machine-learning naming convention.
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
